# TLS front for sshd - makes the SSH connection look like plain HTTPS.
# stunnel terminates a real TLS handshake on :8443 and forwards the
# decrypted stream to the local sshd on 127.0.0.1:22.

foreground = yes
pid = /run/stunnel.pid
cert = /etc/stunnel/stunnel.pem

[ssh-tls]
accept = 0.0.0.0:8443
connect = 127.0.0.1:22
