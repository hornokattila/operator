services:
  operator:
    build: .
    cap_add:
      - SYS_ADMIN
    cgroup: host
    container_name: operator
    hostname: operator
    ports:
      - "8443:8443"
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /run
      - /tmp:exec
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /var/run/docker.sock:/run/docker.sock
      - root:/root
volumes:
  root:
